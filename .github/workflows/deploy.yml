# Baut die App bei jedem Push auf "main" und veröffentlicht sie auf GitHub Pages.
# Einmalig in GitHub: Settings → Pages → Source: "GitHub Actions".
# Außerdem (ohne GitHub Pages):
#   - Wartungszweig 1.x  → fertige App im Release "app-1.x" (für update.sh kanal 1.x)
#   - jede neue Version (package.json) auf main oder 1.x → Tag vX.Y.Z und eigenes Release mit der fertigen App,
#     das nie überschrieben wird (update.sh version …). Tags legt die CI an – direkt pushen geht aus der Claude-Umgebung nicht.
name: Build und Veröffentlichen

on:
  push:
    branches: [main, '1.x']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build
      # Versionskennung für das Update-Skript auf dem eigenen Server
      - run: |
          echo "$(node -p "require('./package.json').version") ${GITHUB_SHA::7}" > dist/app-version.txt
      # Fertige App zusätzlich als ZIP zum Herunterladen (z. B. für den Tiny-Server)
      - uses: actions/upload-artifact@v4
        with:
          name: koffer-fertig-raus-app
          path: dist
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # Eigener Job: zeigt Typfehler deutlich (rot), blockiert die Veröffentlichung aber nicht
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck

  # Automatische Klicktests: gebaute App + echter Abgleich-Server im Browser (Chromium).
  # Nur wenn sie grün sind, geht die App an den eigenen Server (Release) und auf GitHub Pages.
  klicktest:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with:
          name: koffer-fertig-raus-app
          path: dist
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: klicktest-bericht
          path: |
            playwright-report
            test-results
          retention-days: 7

  # Abgleich-Server: eigene Tests (nur Node.js, keine Pakete)
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node --test
        working-directory: server

  # Fertige App als ZIP im Release "app" – für das eigene Hosting (server/proxmox/update.sh)
  release:
    needs: [build, klicktest]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: |
            CHANGELOG.md
            package.json
      - uses: actions/download-artifact@v4
        with:
          name: koffer-fertig-raus-app
          path: dist
      - run: cd dist && zip -qr ../koffer-fertig-raus-app.zip .
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          case "$GITHUB_REF" in
            refs/heads/main)
              # alter Name zusätzlich: für Server, die noch das alte update.sh haben
              cp koffer-fertig-raus-app.zip nix-wie-weg-app.zip
              gh release view app >/dev/null 2>&1 || gh release create app --title "App – neuester Stand" \
                --notes "Automatisch gebaut bei jeder Änderung. Zum Selbst-Hosten: server/proxmox/update.sh lädt diese Datei." --latest=false
              gh release upload app koffer-fertig-raus-app.zip nix-wie-weg-app.zip --clobber
              ;;
            refs/heads/*)
              name="app-$GITHUB_REF_NAME"
              gh release view "$name" >/dev/null 2>&1 || gh release create "$name" --title "App – Wartungszweig $GITHUB_REF_NAME" \
                --notes "Fehlerbehebungen für Version ${GITHUB_REF_NAME%.x}. Auf dem eigenen Server: update.sh kanal $GITHUB_REF_NAME" --latest=false
              gh release upload "$name" koffer-fertig-raus-app.zip --clobber
              ;;
            refs/tags/v*)
              # Notizen: der erste Abschnitt des CHANGELOG
              awk '/^## /{n++} n==1' CHANGELOG.md > notes.md
              printf '\n---\nAuf dem eigenen Server genau diese Version installieren: `update.sh version %s`\n' "${GITHUB_REF_NAME#v}" >> notes.md
              gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --verify-tag \
                --title "KofferFertigRaus $GITHUB_REF_NAME" --notes-file notes.md --latest=false
              gh release upload "$GITHUB_REF_NAME" koffer-fertig-raus-app.zip # ohne --clobber: eine Version wird nie überschrieben
              ;;
          esac
          # Neue Version auf einem Zweig → Tag und festes Release (gibt es die Version schon, bleibt sie unangetastet)
          if [[ $GITHUB_REF == refs/heads/* ]]; then
            ver="v$(node -p "require('./package.json').version")"
            if ! gh release view "$ver" >/dev/null 2>&1; then
              awk '/^## /{n++} n==1' CHANGELOG.md > notes.md
              printf '\n---\nAuf dem eigenen Server genau diese Version installieren: `update.sh version %s`\n' "${ver#v}" >> notes.md
              gh release create "$ver" koffer-fertig-raus-app.zip --target "$GITHUB_SHA" \
                --title "KofferFertigRaus $ver" --notes-file notes.md --latest=false
            fi
          fi

  deploy:
    needs: [build, klicktest]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

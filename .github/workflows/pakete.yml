# Paketversionen festschreiben bzw. bewusst aktualisieren.
# Der normale Build nutzt "npm ci" und baut damit immer mit genau den Versionen aus package-lock.json –
# ein nächtliches Update kann so nichts kaputtmachen, nur weil irgendwo eine neue Paketversion erschienen ist.
#
# Aktualisieren: GitHub → Actions → "Pakete" → Run workflow → "aktualisieren" ankreuzen.
# Die neuen Versionen werden nur übernommen, wenn Tests und Build damit grün sind.
name: Pakete

on:
  workflow_dispatch:
    inputs:
      aktualisieren:
        description: 'Pakete auf neue (kompatible) Versionen heben'
        type: boolean
        default: false
      werkzeug:
        description: 'Nur für die Entwicklung: node_modules als Release "werkzeug" bereitstellen'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # Erzeugt die Datei bzw. ergänzt neu eingetragene Pakete – vorhandene Versionen bleiben unverändert
      - name: package-lock.json mit package.json abgleichen
        run: npm install --package-lock-only --no-audit --no-fund
      - name: Pakete aktualisieren
        if: inputs.aktualisieren
        run: npm update --package-lock-only --no-audit --no-fund
      - name: Prüfen (Tests, Typen, Build)
        run: |
          npm ci --no-audit --no-fund
          npm test
          npm run typecheck
          npm run build
      - name: Werkzeug bereitstellen
        if: inputs.werkzeug
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tar czf node_modules.tgz node_modules package-lock.json
          gh release view werkzeug >/dev/null 2>&1 || gh release create werkzeug --prerelease --title "Entwicklung (temporär)" --notes "Nur für die Entwicklung, wird wieder gelöscht." --latest=false
          gh release upload werkzeug node_modules.tgz --clobber
      - name: Werkzeug wieder entfernen
        if: ${{ !inputs.werkzeug }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete werkzeug --cleanup-tag --yes 2>/dev/null || true
      - name: Übernehmen
        run: |
          git add package-lock.json
          if git diff --cached --quiet; then echo "Keine Änderung."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Paketversionen festgeschrieben (package-lock.json)"
          git push

# nginx: App (PWA) und Abgleich-Server unter einer Adresse
# Ablage: /etc/nginx/sites-available/nix-wie-weg  (Link nach sites-enabled)
# DOMAIN ersetzen (install.sh macht das automatisch). HTTPS ergänzt danach certbot.

server {
    listen 80;
    listen [::]:80;
    server_name DOMAIN;

    root /var/www/nix-wie-weg;
    index index.html;

    # Fotos bis 30 MB (NWW_MAX_BLOB_MB) plus Reserve
    client_max_body_size 40m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;
    gzip_min_length 1024;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    # Abgleich-Server
    location /api/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_read_timeout 120s;
    }

    # Gebaute Dateien (Bootstrap, Icons, Skripte) haben einen Prüfsummen-Namen
    # → dürfen ein Jahr im Cache bleiben.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Service Worker, Manifest und Startseite immer frisch prüfen,
    # sonst kommen Updates der App nicht an.
    location ~* ^/(sw\.js|workbox-.*\.js|registerSW\.js|manifest\.webmanifest|index\.html)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
